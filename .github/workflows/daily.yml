# Every day 12:15 Astana (07:15 UTC), right after the Gemini free limit resets:
# voice paragraphs, then build one fully voiced video and publish files to a release.
name: daily
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: konveyer
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper
          cd remotion && npm install --no-audit --no-fund && npx remotion browser ensure
          git config user.name konveyer && git config user.email konveyer@users.noreply.github.com
      - name: run
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/daily.py
