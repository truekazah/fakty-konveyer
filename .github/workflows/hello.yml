name: hello
on:
  workflow_dispatch:
    inputs:
      rolik:
        description: folder
        default: dolgozhiteli
jobs:
  hi:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: echo ${{ inputs.rolik }} && node --version
      - name: build
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: echo "key len ${#PEXELS_KEY}" && mkdir -p out && echo hi > out/a.txt
      - uses: actions/upload-artifact@v7
        with:
          name: test
          path: out/
          retention-days: 7
