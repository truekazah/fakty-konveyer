name: hello
on:
  workflow_dispatch:
    inputs:
      rolik:
        description: folder
        default: dolgozhiteli
jobs:
  hi:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: echo ${{ inputs.rolik }} && node --version
      - name: build
        env:
          K: ${{ secrets.PEXELS_KEY }}
        run: test -n "$K" && echo key-ok
